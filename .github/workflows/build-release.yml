name: Build and release Rapcha.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/Rapcha.Tests -c Release --nologo

      - name: Cache the whisper engine
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: src/Rapcha/Assets/engine
          key: whisper-x86-v1.9.5-map-${{ hashFiles('native/**') }}

      - name: Build the whisper engine (whisper.cpp v1.9.5, one self-contained 32-bit DLL, AVX2 and SSE builds, embedded in Rapcha.exe)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "whisper.cpp"
          git clone --depth 1 -b v1.9.5 https://github.com/ggml-org/whisper.cpp $src
          if ($LASTEXITCODE -ne 0) { throw "could not get whisper.cpp" }
          $engine = "src/Rapcha/Assets/engine"
          New-Item -ItemType Directory -Force $engine | Out-Null
          foreach ($v in @(@{ n = 'avx2'; f = 'ON' }, @{ n = 'sse'; f = 'OFF' })) {
            $b = Join-Path $env:RUNNER_TEMP ("wb-" + $v.n)
            cmake -S native -B $b -A Win32 ("-DWHISPER_DIR=" + $src.Replace('\','/')) "-DRAPCHA_AVX2=$($v.f)"
            if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($($v.n))" }
            cmake --build $b --config Release --target rapcha_whisper -j 4
            if ($LASTEXITCODE -ne 0) { throw "cmake build failed ($($v.n))" }
            $dll = Get-ChildItem $b -Recurse -Filter "rapcha-whisper.dll" | Select-Object -First 1
            if (-not $dll) { throw "rapcha-whisper.dll not built ($($v.n))" }
            $out = Join-Path $engine ("rapcha-whisper-" + $v.n + ".dll.gz")
            $in = [IO.File]::OpenRead($dll.FullName); $fs = [IO.File]::Create((Join-Path (Get-Location) $out))
            $gz = New-Object IO.Compression.GZipStream($fs, [IO.Compression.CompressionLevel]::Optimal)
            $in.CopyTo($gz); $gz.Dispose(); $fs.Dispose(); $in.Dispose()
            $map = Get-ChildItem $b -Recurse -Filter "rapcha-whisper.map" | Select-Object -First 1
            if ($map) { Copy-Item $map.FullName (Join-Path $engine ("rapcha-whisper-" + $v.n + ".map")) }   # CI only, not embedded
            "{0}: dll {1:N0} bytes, embedded gz {2:N0} bytes" -f $v.n, $dll.Length, (Get-Item $out).Length
          }

      - name: Whisper CPU safety (no AVX in the SSE build - xed instruction scan with the link map, Intel SDE emulating a Goldmont / Celeron N3350, speed)
        shell: powershell
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'; $ProgressPreference = 'SilentlyContinue'
          $t = Join-Path $env:RUNNER_TEMP "cpu-safety"; New-Item -ItemType Directory -Force $t | Out-Null
          $summary = New-Object System.Collections.Generic.List[string]
          $fail = New-Object System.Collections.Generic.List[string]
          foreach ($v in 'sse', 'avx2') {
            $in = [IO.File]::OpenRead((Resolve-Path "src/Rapcha/Assets/engine/rapcha-whisper-$v.dll.gz").Path)
            $gz = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
            $fs = [IO.File]::Create((Join-Path $t "rapcha-whisper-$v.dll")); $gz.CopyTo($fs); $fs.Dispose(); $gz.Dispose(); $in.Dispose()
          }
          # Intel SDE 10.13.1 (Windows), pinned copy, checked against Intel's published SHA-256
          $sdeTar = Join-Path $t "sde.tar.xz"
          Invoke-WebRequest "https://media.githubusercontent.com/media/petarpetrovt/setup-sde/6d2773b/binaries/sde-external-10.13.1-2026-07-28-win.tar.xz" -OutFile $sdeTar
          $h = (Get-FileHash $sdeTar -Algorithm SHA256).Hash
          if ($h -ne '74E626EDE09B0BAA5011FC9E51B58627EA92C3FC0BAE5FD7DB34B490F335F651') { throw "SDE checksum mismatch $h" }
          & 7z x $sdeTar "-o$t" -y | Out-Null; & 7z x (Join-Path $t "sde.tar") "-o$t" -y | Out-Null
          $sde = (Get-ChildItem $t -Recurse -Filter sde.exe | Select-Object -First 1).FullName
          $xed = Join-Path (Split-Path $sde) "xed.exe"
          "SDE: $sde"
          # 1) static scan: every instruction in each DLL, grouped by the function (from the link map) it belongs to
          $avxExt = '^(AVX|AVX2|AVX2GATHER|FMA|F16C|BMI2|AVX512.*|AVXAES|VAES|VPCLMULQDQ|AVX_VNNI.*)$'
          foreach ($v in 'sse', 'avx2') {
            $dll = Join-Path $t "rapcha-whisper-$v.dll"
            $syms = New-Object System.Collections.Generic.List[object]
            $mapPath = "src/Rapcha/Assets/engine/rapcha-whisper-$v.map"
            if (Test-Path $mapPath) {
              foreach ($l in Get-Content $mapPath) {
                $m = [regex]::Match($l, '^\s*[0-9a-fA-F]{4}:[0-9a-fA-F]{8}\s+(\S+)\s+([0-9a-fA-F]{8})\s+(?:f\s+)?(?:i\s+)?(\S+)\s*$')
                if ($m.Success) { $syms.Add(@([Convert]::ToUInt32($m.Groups[2].Value, 16), $m.Groups[1].Value, $m.Groups[3].Value)) }
              }
              $syms = @($syms | Sort-Object { $_[0] })
            }
            "map symbols ($v): $($syms.Count)"
            $groups = @{}; $count = 0; $total = 0
            foreach ($l in (& $xed -i $dll -isa-set 2>&1)) {
              $m = [regex]::Match([string]$l, '^XDIS ([0-9a-f]+): +(\S+) +(\S+) +(\S+)')
              if (-not $m.Success) { continue }
              $total++
              if ($m.Groups[3].Value -notmatch $avxExt) { continue }
              $count++
              $a = [Convert]::ToUInt32($m.Groups[1].Value, 16); $owner = "unknown (no map)"
              if ($syms.Count -gt 0) { $lo = 0; $hi = $syms.Count - 1; $best = -1
                while ($lo -le $hi) { $mid = [int][Math]::Floor(($lo + $hi) / 2); if ($syms[$mid][0] -le $a) { $best = $mid; $lo = $mid + 1 } else { $hi = $mid - 1 } }
                if ($best -ge 0) { $owner = $syms[$best][1] + " in " + $syms[$best][2] } }
              $k = $owner + " [" + $m.Groups[3].Value + "]"; if ($groups.ContainsKey($k)) { $groups[$k]++ } else { $groups[$k] = 1 }
            }
            "== xed $v : $total instructions, $count from AVX/AVX2/FMA/F16C/BMI2/AVX-512, by function:"
            $groups.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 40 | ForEach-Object { "  {0,6}  {1}" -f $_.Value, $_.Key }
            if ($v -eq 'sse') {
              $nonCrt = @($groups.Keys | Where-Object { $_ -notmatch ' in (libvcruntime|libucrt|libcmt|libcpmt|msvcrt|vcruntime|ucrt)[^ ]*:' })
              $summary.Add("Static scan of the SSE build: $total instructions, $count AVX-family instructions; all of them in the Microsoft C runtime (" + (($groups.Keys | ForEach-Object { ($_ -split ' in ')[0] } | Sort-Object -Unique) -join ', ') + "), which only uses them after checking CPUID: " + ($nonCrt.Count -eq 0))
              if ($nonCrt.Count -gt 0) { $fail.Add("AVX-family instructions outside the C runtime in the SSE build: " + ($nonCrt -join '; ')) }
            } else { $summary.Add("Static scan of the AVX2 build (for comparison): $count AVX-family instructions") }
          }
          # 2) the bench program and model
          cmake -S native/bench -B (Join-Path $t "bench") -A Win32 | Out-Null
          cmake --build (Join-Path $t "bench") --config Release | Out-Null
          $bench = (Get-ChildItem (Join-Path $t "bench") -Recurse -Filter rw_bench.exe | Select-Object -First 1).FullName
          if (-not $bench) { throw "rw_bench build failed" }
          $model = Join-Path $t "ggml-tiny.en.bin"
          Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model
          $mh = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
          if ($mh -ne '921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f') { throw "tiny.en checksum mismatch $mh" }
          Add-Type -AssemblyName System.Speech
          $wav = Join-Path $t "speech16k.wav"
          $syn = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $syn.SetOutputToWaveFile($wav, $fmt)
          $syn.Speak("The boy is coming. He is coming home from school today. We will meet at the market on Saturday morning.")
          $syn.SetOutputToNull(); $syn.Dispose()
          function Run-Limited($file, $argList, $name, $seconds) {
            $o = Join-Path $t "$name.out.txt"; $e = Join-Path $t "$name.err.txt"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $file -ArgumentList $argList -RedirectStandardOutput $o -RedirectStandardError $e -PassThru -NoNewWindow
            $null = $p.Handle
            $timedOut = -not $p.WaitForExit($seconds * 1000)
            if ($timedOut) { try { Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force } } catch {}; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Get-Process rw_bench -ErrorAction SilentlyContinue | Stop-Process -Force }
            $sw.Stop()
            $text = ((Get-Content $o -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $e -Raw -ErrorAction SilentlyContinue))
            if ($text.Length -gt 6000) { $text = $text.Substring(0, 6000) + "`n...(cut)" }
            return ,@($(if ($timedOut) { 'timeout' } else { $p.ExitCode }), $text, [int]$sw.Elapsed.TotalSeconds)
          }
          # 3) native speed on this runner
          foreach ($run in @(@('sse', 2), @('sse', 1), @('avx2', 2))) {
            $r = Run-Limited $bench ('"' + (Join-Path $t "rapcha-whisper-$($run[0]).dll") + '" "' + $model + '" "' + $wav + '" ' + $run[1]) "native-$($run[0])-$($run[1])" 300
            "== native $($run[0]) threads=$($run[1]) exit=$($r[0])"; $r[1]
            $m = [regex]::Match($r[1], 'transcribe_ms=(\d+) audio_s=([\d.]+) rtf=([\d.]+)')
            $summary.Add("Native on the runner, $($run[0]) build, $($run[1]) thread(s): " + $m.Value + " text: " + ([regex]::Match($r[1], 'text: (.*)').Groups[1].Value.Trim()))
          }
          # 4) the SSE build under Intel SDE pretending to be a Goldmont CPU (Celeron N3350 family). -chip_check_die 1: SDE stops at the
          #    first instruction the Goldmont does not have and prints it.
          $chk = Join-Path $t "chk-sse.txt"
          $r = Run-Limited $sde ('-glm -chip_check_die 1 -chip_check_emit_file 1 -chip_check_file "' + $chk + '" -- "' + $bench + '" "' + (Join-Path $t "rapcha-whisper-sse.dll") + '" "' + $model + '" "' + $wav + '" 2') "sde-sse" 900
          $chkText = if (Test-Path $chk) { Get-Content $chk -Raw } else { "" }
          $hits = ([regex]::Matches($r[1] + "`n" + $chkText, '(?i)not valid for specified chip')).Count
          "== SDE -glm sse: exit $($r[0]) in $($r[2]) s, chip-check reports: $hits"; $r[1]; $chkText
          $okText = [regex]::Match($r[1], 'text: (.*)').Groups[1].Value.Trim()
          $rt = [regex]::Match($r[1], 'transcribe_ms=\d+')
          $summary.Add("Intel SDE emulating Goldmont (-glm, stop at the first instruction it lacks), SSE build, 2 threads: exit $($r[0]) after $($r[2]) s, instructions the Goldmont lacks: $hits, $($rt.Value), text: $okText")
          if ("$($r[0])" -ne '0' -or $hits -ne 0 -or $okText.Length -lt 20) { $fail.Add("SSE Whisper build did not run cleanly on the emulated Goldmont") }
          # negative control: the AVX2 build must be stopped at once
          $chk2 = Join-Path $t "chk-avx2.txt"
          $n = Run-Limited $sde ('-glm -chip_check_die 1 -chip_check_emit_file 1 -chip_check_file "' + $chk2 + '" -- "' + $bench + '" "' + (Join-Path $t "rapcha-whisper-avx2.dll") + '" "' + $model + '" "' + $wav + '" 2') "sde-avx2" 300
          $chk2Text = if (Test-Path $chk2) { Get-Content $chk2 -Raw } else { "" }
          $nhits = ([regex]::Matches($n[1] + "`n" + $chk2Text, '(?i)not valid for specified chip')).Count
          $first = [regex]::Match($n[1] + "`n" + $chk2Text, '(?im)^.*not valid for specified chip.*$').Value.Trim()
          "== SDE -glm avx2 (negative control): exit $($n[0]) in $($n[2]) s, reports: $nhits"; $n[1]; $chk2Text
          $summary.Add("Negative control, AVX2 build under the same Goldmont emulation: exit $($n[0]), stopped: " + ($nhits -gt 0) + " - " + $first)
          if ($nhits -le 0) { $fail.Add("negative control did not catch the AVX2 build - the SDE check is not working") }
          "## Whisper CPU safety (Celeron N3350 = Goldmont, no AVX)" >> $env:GITHUB_STEP_SUMMARY
          $summary | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "rapcha-shots\v20") | Out-Null
          $summary | Set-Content (Join-Path $env:RUNNER_TEMP "rapcha-shots\v20\cpu-safety.txt")
          $summary
          if ($fail.Count -gt 0) { $fail; throw ($fail -join '; ') }

      - name: Build Rapcha.exe
        run: dotnet build src/Rapcha/Rapcha.csproj -c Release --nologo -p:RAPCHA_BUILD=${{ github.run_number }}

      - name: Select-to-speak overlay self-test (OCR, box/two-click/tap selection, two-column book order, SAPI word progress, ring tap while reading, Piper cleanup)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          # The offline Windows OCR needs an OCR language. Desktop Windows has it with the display language; add it if this runner lacks it.
          $cap = Get-WindowsCapability -Online -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Language.OCR*en-US*' }
          "OCR capability: $($cap.Name) $($cap.State)"
          if ($cap -and $cap.State -ne 'Installed') { try { Add-WindowsCapability -Online -Name $cap.Name | Out-Null; "OCR capability installed" } catch { "::warning::Could not add the OCR capability: $_" } }
          # A leftover Piper folder from v5/v6 must be removed on start.
          $piper = Join-Path $env:APPDATA "Rapcha\piper"
          New-Item -ItemType Directory -Force (Join-Path $piper "voices") | Out-Null
          Set-Content -Path (Join-Path $piper "voices\old.onnx") -Value "leftover"
          $file = Join-Path $env:RUNNER_TEMP "rapcha-ocr.txt"
          Set-Content -Path $file -Value "The quick brown fox jumps over the lazy dog.`r`nThis second line must not be read." -NoNewline
          $np = Start-Process notepad.exe -ArgumentList ('"' + $file + '"') -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ocr "quick brown fox"' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(200000)) { Stop-Process -Id $p.Id -Force; throw "Overlay self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest ocr|Overlay|OCR|Piper|piper|Voice|capture|Unhandled|Exception| at " | Select-Object -Last 40 }
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          "Overlay self-test exit code: $code (0 ok, 2 no voice, 3 words not recognised, 4 selection/reading wrong, 5 close/cleanup failed, 6 no OCR language, 7 two-column page out of order, 8 a ring tap while reading started voice typing)"
          "## Select-to-speak overlay self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path $piper) { throw "The old Piper folder was not deleted" }
          if ($code -ne 0) { throw "Overlay self-test failed ($code)" }

      - name: Ring self-test (clickable hole, resting, wake tap, spinner, ring + bubble move together, four-edge docking, field outline)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $file = Join-Path $env:RUNNER_TEMP "rapcha-field.txt"
          Set-Content -Path $file -Value "Field outline test" -NoNewline
          $np = Start-Process notepad.exe -ArgumentList ('"' + $file + '"') -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ring' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Ring self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest ring|Ring |Unhandled|Exception" | Select-Object -Last 30 }
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          "Ring self-test exit code: $code (0 ok, 11 hole, 12 resting, 13 wake tap, 14 spinner, 15 move together, 16 field outline, 18 four-edge docking)"
          "## Ring self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Ring self-test failed ($code)" }

      - name: Main window self-test (history + word count, Home, Copy, Delete, Vocabulary, Glow colour, rounded outline, screenshots)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-main "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Main window self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest main|History|Vocabulary|Glow colour|Unhandled|Exception" | Select-Object -Last 30 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "Main window self-test exit code: $code (0 ok, 21 history, 22 Home page, 23 copy, 24 delete, 25 vocabulary, 26 glow colour saved, 27 outline colour/shape, 28 close/dispose)"
          "## Main window self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Main window self-test failed ($code)" }

      - name: v11 self-test (text-field detection + focus following, ring wake, one colour, 4-line words box at 100/150/200%, rounded edge glow, Space+V chords, hold to talk, conflicts, Settings Shortcuts)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v11"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v11 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "v11 self-test hung" }
          $code = $p.ExitCode
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v11|Shortcut|Unhandled|Exception| at " | Select-Object -Last 60 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "v11 self-test exit code: $code (0 ok, 31 Notepad not accepted, 32 pane/list/desktop not rejected, 33 outline did not move, 34 outline did not hide, 35 ring wake, 36 bubble colour, 37 bubble layout, 38 edge glow, 39 chords/lone Space, 40 hold-to-talk events, 41 conflict logic, 42 Settings shortcuts)"
          "## v11 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v11 self-test failed ($code)" }

      - name: v12 self-test (all Windows voices listed, reading with the chosen OneCore/SAPI voice, fallback, Settings voice picker + Preview, typing keeps the ring awake, smooth wake)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v12"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v12 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; throw "v12 self-test hung" }
          $code = $p.ExitCode
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v12|Voices|OneCore|Ring: woke|Ring resting|Typing watcher|Unhandled|Exception| at " | Select-Object -Last 70 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "v12 self-test exit code: $code (0 ok, 51 no voices, 52 reading with a voice, 53 fallback, 54 Settings voice picker, 55 typing did not wake, 56 wake animation not smooth, 57 typing did not keep it awake, 58 typing without a text field woke it)"
          "## v12 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v12 self-test failed ($code)" }

      - name: v13 self-test (multi-pass OCR on a video-like test screen, box semantics, tap on code, recall before/after, first word < 1.5 s, no rotating ring, white app icon, Settings Edit/Reset)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v13"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v13 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "v13 self-test hung" }
          $code = $p.ExitCode
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v13|Overlay|OCR|OneCore|Settings: select|Unhandled|Exception| at " | Select-Object -Last 90 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          $recall = Join-Path $shots "ocr-recall.txt"
          if (Test-Path $recall) { Get-Content $recall; "## v13 recall" >> $env:GITHUB_STEP_SUMMARY; Get-Content $recall | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY }
          "v13 self-test exit code: $code (0 ok, 60 OCR unavailable, 61 two-line box, 62 list box, 63 tap on code, 64 small/coloured text, 65 first word too slow, 66 ring decoration changes, 67 icon, 68 Settings Edit/Done, 69 Settings Reset)"
          "## v13 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
