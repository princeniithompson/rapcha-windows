name: Build and release Rapcha.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/Rapcha.Tests -c Release --nologo

      - name: Build Rapcha.exe
        run: dotnet build src/Rapcha/Rapcha.csproj -c Release --nologo -p:RAPCHA_BUILD=${{ github.run_number }}

      - name: Select-to-speak self-test (mode toggle + offline voice)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-speak "Put the food in the container, open the container. Then close the lid and put it away."' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "Speak self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest|Select to speak|Reading|hooks|Speech" }
          "Speak self-test exit code: $code"
          "## Select-to-speak self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -eq 2) { "::warning::No Windows voice on this runner; speech not exercised" }
          elseif ($code -ne 0) { throw "Speak self-test failed ($code)" }

      - name: Piper voice self-test (download, verify SHA-256, synthesize)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-piper "Put the food in the container, open the container."' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw "Piper self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest piper|Voice download|Piper" }
          $dir = Join-Path $env:APPDATA "Rapcha\piper"
          if (Test-Path $dir) { "Installed voice folder: {0:N1} MB" -f ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) }
          "Piper self-test exit code: $code"
          "## Piper self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Piper self-test failed ($code)" }

      - name: Select-to-speak self-test with Piper (phrases, timing, Forward 10)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $text = 'Put the food in the container, open the container. Then close the lid and put it away. When you are done, wash your hands, dry them well, and sit down to enjoy the meal with your family.'
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-speak "' + $text + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Piper speak self-test hung" }
          $code = $p.ExitCode
          $lines = if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest speak|Reading:|Piper" } else { @() }
          $lines | Select-Object -Last 12
          "Piper speak self-test exit code: $code"
          if ($code -ne 0) { throw "Piper speak self-test failed ($code)" }
          if (-not ($lines | Select-String "finished engine=piper.*ok=True")) { throw "Reading did not use Piper" }

      - name: Paste self-test (Notepad, informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $np = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-paste "Rapcha paste check 4711"' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "Paste self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest paste|Delivery" }
          "Paste self-test exit code: $code (0 typed+found, 3 copied only, 1 failed)"
          "## Paste self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { throw "Paste self-test did not confirm the paste ($code)" }

      - name: Smoke test (start, single instance, update hand-off)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          try {
            # 1. An old v1 is running (v1 does not listen for the quit signal): the new build must close it.
            $oldDir = Join-Path $env:RUNNER_TEMP "v1"; New-Item -ItemType Directory -Force $oldDir | Out-Null
            $oldExe = Join-Path $oldDir "Rapcha.exe"
            Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/v1/Rapcha.exe" -OutFile $oldExe
            $v1 = Start-Process -FilePath $oldExe -PassThru
            Start-Sleep -Seconds 6
            if ($v1.HasExited) { throw "v1 did not start" }
            $p1 = Start-Process -FilePath $exe -PassThru
            if (-not $v1.WaitForExit(15000)) { throw "The new build did not replace the running v1" }
            Start-Sleep -Seconds 6
            if ($p1.HasExited) { throw "Rapcha.exe exited early with code $($p1.ExitCode)" }
            "Working set: {0:N1} MB" -f ((Get-Process -Id $p1.Id).WorkingSet64 / 1MB)

            # 2. The same exe again: exits quietly (no message box) and leaves the first one running.
            $p2 = Start-Process -FilePath $exe -PassThru
            if (-not $p2.WaitForExit(10000)) { throw "Second launch of the same build did not exit" }
            if ($p1.HasExited) { throw "First instance died when the same build was launched again" }

            # 3. A copy elsewhere counts as a different build: the running one quits cleanly via the signal.
            $newDir = Join-Path $env:RUNNER_TEMP "moved"; New-Item -ItemType Directory -Force $newDir | Out-Null
            Copy-Item $exe (Join-Path $newDir "Rapcha.exe")
            $p3 = Start-Process -FilePath (Join-Path $newDir "Rapcha.exe") -PassThru
            if (-not $p1.WaitForExit(15000)) { throw "Old instance did not quit for the new one" }
            Start-Sleep -Seconds 5
            if ($p3.HasExited) { throw "New instance exited after taking over (code $($p3.ExitCode))" }

            $desk = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) "Rapcha.lnk"
            $start = Join-Path ([Environment]::GetFolderPath('Programs')) "Rapcha.lnk"
            if (-not (Test-Path $desk) -or -not (Test-Path $start)) { throw "Shortcuts were not created" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($desk).TargetPath
            "Desktop shortcut -> $target"
            if ($target -ne (Join-Path $newDir "Rapcha.exe")) { throw "Shortcut was not refreshed after the exe moved" }
            Stop-Process -Id $p3.Id -Force
          }
          finally {
            if (Test-Path $log) { Get-Content $log }
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src/Rapcha/bin/Release/Rapcha.exe"
          $tag = "v${{ github.run_number }}"
          $size = (Get-Item $exe).Length
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Rapcha for Windows, build ${{ github.run_number }} ($env:GITHUB_SHA).`n`nDownload **Rapcha.exe** and open it. If Windows says 'Windows protected your PC', click More info and then Run anyway.`n`nSize: $size bytes`nSHA-256: $sha"
          gh release create $tag $exe --title "Rapcha for Windows $tag" --notes "$notes" --latest --target $env:GITHUB_SHA
          "## Rapcha.exe released as $tag" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| | |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Size | $size bytes ({0:N0} KB) |" -f ($size / 1KB) >> $env:GITHUB_STEP_SUMMARY
          "| SHA-256 | ``$sha`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Download | https://github.com/${{ github.repository }}/releases/latest/download/Rapcha.exe |" >> $env:GITHUB_STEP_SUMMARY
