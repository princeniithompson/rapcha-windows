name: Build and release Rapcha.exe

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/Rapcha.Tests -c Release --nologo

      - name: Build Rapcha.exe
        run: dotnet build src/Rapcha/Rapcha.csproj -c Release --nologo -p:RAPCHA_BUILD=${{ github.run_number }}

      - name: Select-to-speak overlay self-test (OCR, box/two-click/tap selection, two-column book order, SAPI word progress, ring tap while reading, Piper cleanup)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          # The offline Windows OCR needs an OCR language. Desktop Windows has it with the display language; add it if this runner lacks it.
          $cap = Get-WindowsCapability -Online -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'Language.OCR*en-US*' }
          "OCR capability: $($cap.Name) $($cap.State)"
          if ($cap -and $cap.State -ne 'Installed') { try { Add-WindowsCapability -Online -Name $cap.Name | Out-Null; "OCR capability installed" } catch { "::warning::Could not add the OCR capability: $_" } }
          # A leftover Piper folder from v5/v6 must be removed on start.
          $piper = Join-Path $env:APPDATA "Rapcha\piper"
          New-Item -ItemType Directory -Force (Join-Path $piper "voices") | Out-Null
          Set-Content -Path (Join-Path $piper "voices\old.onnx") -Value "leftover"
          $file = Join-Path $env:RUNNER_TEMP "rapcha-ocr.txt"
          Set-Content -Path $file -Value "The quick brown fox jumps over the lazy dog.`r`nThis second line must not be read." -NoNewline
          $np = Start-Process notepad.exe -ArgumentList ('"' + $file + '"') -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ocr "quick brown fox"' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(200000)) { Stop-Process -Id $p.Id -Force; throw "Overlay self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest ocr|Overlay|OCR|Piper|piper|Voice|capture|Unhandled|Exception| at " | Select-Object -Last 40 }
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          "Overlay self-test exit code: $code (0 ok, 2 no voice, 3 words not recognised, 4 selection/reading wrong, 5 close/cleanup failed, 6 no OCR language, 7 two-column page out of order, 8 a ring tap while reading started voice typing)"
          "## Select-to-speak overlay self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path $piper) { throw "The old Piper folder was not deleted" }
          if ($code -ne 0) { throw "Overlay self-test failed ($code)" }

      - name: Ring self-test (clickable hole, resting, wake tap, spinner, ring + bubble move together, four-edge docking, field outline)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $file = Join-Path $env:RUNNER_TEMP "rapcha-field.txt"
          Set-Content -Path $file -Value "Field outline test" -NoNewline
          $np = Start-Process notepad.exe -ArgumentList ('"' + $file + '"') -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-ring' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Ring self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest ring|Ring |Unhandled|Exception" | Select-Object -Last 30 }
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          "Ring self-test exit code: $code (0 ok, 11 hole, 12 resting, 13 wake tap, 14 spinner, 15 move together, 16 field outline, 18 four-edge docking)"
          "## Ring self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Ring self-test failed ($code)" }

      - name: Main window self-test (history + word count, Home, Copy, Delete, Vocabulary, Glow colour, rounded outline, screenshots)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-main "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Main window self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest main|History|Vocabulary|Glow colour|Unhandled|Exception" | Select-Object -Last 30 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "Main window self-test exit code: $code (0 ok, 21 history, 22 Home page, 23 copy, 24 delete, 25 vocabulary, 26 glow colour saved, 27 outline colour/shape, 28 close/dispose)"
          "## Main window self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "Main window self-test failed ($code)" }

      - name: v11 self-test (text-field detection + focus following, ring wake, one colour, 4-line words box at 100/150/200%, rounded edge glow, Space+V chords, hold to talk, conflicts, Settings Shortcuts)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v11"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v11 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "v11 self-test hung" }
          $code = $p.ExitCode
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v11|Shortcut|Unhandled|Exception| at " | Select-Object -Last 60 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "v11 self-test exit code: $code (0 ok, 31 Notepad not accepted, 32 pane/list/desktop not rejected, 33 outline did not move, 34 outline did not hide, 35 ring wake, 36 bubble colour, 37 bubble layout, 38 edge glow, 39 chords/lone Space, 40 hold-to-talk events, 41 conflict logic, 42 Settings shortcuts)"
          "## v11 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v11 self-test failed ($code)" }

      - name: v12 self-test (all Windows voices listed, reading with the chosen OneCore/SAPI voice, fallback, Settings voice picker + Preview, typing keeps the ring awake, smooth wake)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v12"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v12 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; throw "v12 self-test hung" }
          $code = $p.ExitCode
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v12|Voices|OneCore|Ring: woke|Ring resting|Typing watcher|Unhandled|Exception| at " | Select-Object -Last 70 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          "v12 self-test exit code: $code (0 ok, 51 no voices, 52 reading with a voice, 53 fallback, 54 Settings voice picker, 55 typing did not wake, 56 wake animation not smooth, 57 typing did not keep it awake, 58 typing without a text field woke it)"
          "## v12 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v12 self-test failed ($code)" }

      - name: v13 self-test (multi-pass OCR on a video-like test screen, box semantics, tap on code, recall before/after, first word < 1.5 s, no rotating ring, white app icon, Settings Edit/Reset)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v13"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v13 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "v13 self-test hung" }
          $code = $p.ExitCode
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v13|Overlay|OCR|OneCore|Settings: select|Unhandled|Exception| at " | Select-Object -Last 90 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          $recall = Join-Path $shots "ocr-recall.txt"
          if (Test-Path $recall) { Get-Content $recall; "## v13 recall" >> $env:GITHUB_STEP_SUMMARY; Get-Content $recall | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY }
          "v13 self-test exit code: $code (0 ok, 60 OCR unavailable, 61 two-line box, 62 list box, 63 tap on code, 64 small/coloured text, 65 first word too slow, 66 ring decoration changes, 67 icon, 68 Settings Edit/Done, 69 Settings Reset)"
          "## v13 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v13 self-test failed ($code)" }

      - name: v14 self-test (real injected mouse input; thin strip reads full lines; tap reads the paragraph; two corners with a pause; Esc; flicker frames; latency cold and warm)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v14"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v14 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; throw "v14 self-test hung" }
          $code = $p.ExitCode
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v14|Overlay|Voices|OCR|OneCore|Unhandled|Exception| at " | Select-Object -Last 120 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          $lat = Join-Path $shots "latency.txt"
          if (Test-Path $lat) { Get-Content $lat; "## v14 latency (release to first audio)" >> $env:GITHUB_STEP_SUMMARY; Get-Content $lat >> $env:GITHUB_STEP_SUMMARY }
          "v14 self-test exit code: $code (0 ok, 70 OCR unavailable, 71 strip not full lines, 72 tap paragraph, 73 two-corner mode, 74 flicker, 75 Esc, 76 latency, 77 repeated words)"
          "## v14 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v14 self-test failed ($code)" }

      - name: v15 self-test (Previous / Next by paragraph and list item with keys and buttons; 1.5 s restart; paused; Finished; tap neighbours; latency; number badges outside text, toggle; keys left alone when not reading; icon)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $shots = Join-Path $env:RUNNER_TEMP "rapcha-shots\v15"
          $p = Start-Process -FilePath $exe -ArgumentList ('--selftest-v15 "' + $shots + '"') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(360000)) { Stop-Process -Id $p.Id -Force; throw "v15 self-test hung" }
          $code = $p.ExitCode
          Get-Process Rapcha -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest v15|Overlay nav|Overlay latency|Voices|OneCore|Shortcuts|Settings|Unhandled|Exception| at " | Select-Object -Last 120 }
          Get-ChildItem $shots -ErrorAction SilentlyContinue | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          $res = Join-Path $shots "v15-results.txt"
          if (Test-Path $res) { Get-Content $res; "## v15 Previous / Next and badges" >> $env:GITHUB_STEP_SUMMARY; Get-Content $res >> $env:GITHUB_STEP_SUMMARY }
          "v15 self-test exit code: $code (0 ok, 80 OCR unavailable, 81 badges, 82 Previous/Next order or highlight, 83 paused move, 84 Finished, 85 tap neighbours, 86 badges off changed reading, 87 keys taken while inactive, 88 latency, 89 settings toggle, 90 icon)"
          "## v15 self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { throw "v15 self-test failed ($code)" }

      - name: Upload main window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapcha-screenshots
          path: ${{ runner.temp }}/rapcha-shots
          if-no-files-found: warn
          retention-days: 30

      - name: Downloaded-file mark is removed on first run
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "motw"; New-Item -ItemType Directory -Force $dir | Out-Null
          $copy = Join-Path $dir "Rapcha.exe"
          Copy-Item "src/Rapcha/bin/Release/Rapcha.exe" $copy
          Set-Content -Path $copy -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
          if (-not (Get-Item $copy -Stream Zone.Identifier -ErrorAction SilentlyContinue)) { throw "Could not mark the test copy" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo($copy, "--selftest-unblock")
          $psi.UseShellExecute = $false   # CreateProcess: no security prompt on the runner
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Unblock run hung" }
          $left = Get-Item $copy -Stream Zone.Identifier -ErrorAction SilentlyContinue
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          Get-Content $log | Select-String "downloaded-file mark" | Select-Object -Last 2
          if ($left) { throw "Zone.Identifier is still there" }
          "Mark-of-the-Web removed"

      - name: Paste self-test (Notepad, informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          $np = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest-paste "Rapcha paste check 4711"' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "Paste self-test hung" }
          $code = $p.ExitCode
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern "Selftest paste|Delivery" }
          "Paste self-test exit code: $code (0 typed+found, 3 copied only, 1 failed)"
          "## Paste self-test: exit $code" >> $env:GITHUB_STEP_SUMMARY
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) { throw "Paste self-test did not confirm the paste ($code)" }

      - name: Smoke test (start, main window on every launch, single instance, update hand-off)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "src/Rapcha/bin/Release/Rapcha.exe").Path
          $log = Join-Path $env:APPDATA "Rapcha\rapcha.log"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class RapchaWin {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, int m, IntPtr w, IntPtr l);
            // Visible top-level window with this title; pid 0 = any process. Returns "pid:hwnd" list for logging too.
            public static IntPtr Find(string title, int pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => {
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                if (sb.ToString() != title || !IsWindowVisible(h)) return true;
                uint p; GetWindowThreadProcessId(h, out p);
                if (pid != 0 && p != (uint)pid) return true;
                found = h; return false;
              }, IntPtr.Zero);
              return found;
            }
            public static string Owner(string title) {
              var list = new StringBuilder();
              EnumWindows((h, l) => {
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                if (sb.ToString() == title) { uint p; GetWindowThreadProcessId(h, out p); list.Append(p + (IsWindowVisible(h) ? ":visible " : ":hidden ")); }
                return true;
              }, IntPtr.Zero);
              return list.ToString();
            }
          }
          '@
          function MainWindowOf([int]$procId, [int]$waitMs = 8000) {
            $until = (Get-Date).AddMilliseconds($waitMs)
            do {
              $h = [RapchaWin]::Find("Rapcha for Windows", $procId)
              if ($h -ne [IntPtr]::Zero) { return $h }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $until)
            "   (windows titled 'Rapcha for Windows': [" + [RapchaWin]::Owner("Rapcha for Windows") + "], expected pid $procId)" | Write-Host
            return [IntPtr]::Zero
          }
          function CloseMainWindow() {
            $h = [RapchaWin]::Find("Rapcha for Windows", 0)
            if ($h -ne [IntPtr]::Zero) { [void][RapchaWin]::PostMessage($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) }
            Start-Sleep -Seconds 1
            if ([RapchaWin]::Find("Rapcha for Windows", 0) -ne [IntPtr]::Zero) { throw "The main window did not close" }
          }
          try {
            # 1. An old v1 is running (v1 does not listen for the quit signal): the new build must close it.
            $oldDir = Join-Path $env:RUNNER_TEMP "v1"; New-Item -ItemType Directory -Force $oldDir | Out-Null
            $oldExe = Join-Path $oldDir "Rapcha.exe"
            Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/v1/Rapcha.exe" -OutFile $oldExe
            $v1 = Start-Process -FilePath $oldExe -PassThru
            Start-Sleep -Seconds 6
            if ($v1.HasExited) { throw "v1 did not start" }
            $p1 = Start-Process -FilePath $exe -PassThru
            if (-not $v1.WaitForExit(15000)) { throw "The new build did not replace the running v1" }
            Start-Sleep -Seconds 4
            if ($p1.HasExited) { throw "Rapcha.exe exited early with code $($p1.ExitCode)" }
            if ((MainWindowOf $p1.Id) -eq [IntPtr]::Zero) { throw "A fresh manual start did not show the main window" }
            "1. fresh start: main window shown"
            "Working set: {0:N1} MB" -f ((Get-Process -Id $p1.Id).WorkingSet64 / 1MB)
            CloseMainWindow
            if ($p1.HasExited) { throw "Closing the main window quit Rapcha (the ring must keep running)" }
            "   main window closed, Rapcha still running. Working set: {0:N1} MB" -f ((Get-Process -Id $p1.Id).WorkingSet64 / 1MB)

            # 2. The same exe again: exits quietly and the running copy shows its main window.
            $p2 = Start-Process -FilePath $exe -PassThru
            if (-not $p2.WaitForExit(10000)) { throw "Second launch of the same build did not exit" }
            if ($p1.HasExited) { throw "First instance died when the same build was launched again" }
            if ((MainWindowOf $p1.Id) -eq [IntPtr]::Zero) { throw "A second launch did not show the main window" }
            "2. second launch, same path: main window shown by the running copy"
            CloseMainWindow

            # 2b. The Desktop shortcut while it runs: the running copy shows the main window, nothing else starts.
            $desk0 = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) "Rapcha.lnk"
            $shows0 = @(Get-Content $log | Select-String "Show requested by a second launch").Count
            Start-Process $desk0
            $h = MainWindowOf $p1.Id
            $shows1 = @(Get-Content $log | Select-String "Show requested by a second launch").Count
            $count = @(Get-Process Rapcha -ErrorAction SilentlyContinue).Count
            "2b. shortcut: show_requests $shows0 -> $shows1, Rapcha processes=$count, main_window=$($h -ne [IntPtr]::Zero)"
            if ($h -eq [IntPtr]::Zero) { throw "Launching the shortcut did not show the main window" }
            if ($count -ne 1) { throw "Launching the shortcut left $count Rapcha processes" }
            if ($p1.HasExited) { throw "First instance died when the shortcut was launched" }
            CloseMainWindow

            # 3. A downloaded copy elsewhere ("Rapcha (4).exe"): it takes over and shows the main window.
            $newDir = Join-Path $env:RUNNER_TEMP "Downloads"; New-Item -ItemType Directory -Force $newDir | Out-Null
            $moved = Join-Path $newDir "Rapcha (4).exe"
            Copy-Item $exe $moved
            $p3 = Start-Process -FilePath $moved -PassThru
            if (-not $p1.WaitForExit(15000)) { throw "Old instance did not quit for the new one" }
            Start-Sleep -Seconds 3
            if ($p3.HasExited) { throw "New instance exited after taking over (code $($p3.ExitCode))" }
            if ((MainWindowOf $p3.Id) -eq [IntPtr]::Zero) { throw "Launching a copy from another path did not end with the main window visible" }
            "3. 'Rapcha (4).exe' from another folder: took over and shows the main window"
            CloseMainWindow

            $desk = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) "Rapcha.lnk"
            $start = Join-Path ([Environment]::GetFolderPath('Programs')) "Rapcha.lnk"
            if (-not (Test-Path $desk) -or -not (Test-Path $start)) { throw "Shortcuts were not created" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($desk).TargetPath
            "Desktop shortcut -> $target"
            if ($target -ne $moved) { throw "Shortcut was not refreshed after the exe moved" }

            # 4. The (refreshed) Start Menu shortcut while the moved copy runs: main window again.
            Start-Process $start
            if ((MainWindowOf $p3.Id) -eq [IntPtr]::Zero) { throw "The Start Menu shortcut did not show the main window" }
            "4. Start Menu shortcut: main window shown by the running copy"
            Stop-Process -Id $p3.Id -Force
          }
          finally {
            if (Test-Path $log) { Get-Content $log }
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src/Rapcha/bin/Release/Rapcha.exe"
          $tag = "v${{ github.run_number }}"
          $size = (Get-Item $exe).Length
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Rapcha for Windows, build ${{ github.run_number }} ($env:GITHUB_SHA).`n`nDownload **Rapcha.exe** and open it. If Windows says 'Windows protected your PC', click More info and then Run anyway.`n`nSize: $size bytes`nSHA-256: $sha"
          gh release create $tag $exe --title "Rapcha for Windows $tag" --notes "$notes" --latest --target $env:GITHUB_SHA
          "## Rapcha.exe released as $tag" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| | |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
